# lgtv-tune settings (shell syntax). Edit, then run:  .\lgtv.ps1 deploy ; .\lgtv.ps1 apply
# Written for LG 43UR7500PSC, webOS 25 (TV Lite 10.3.1), rooted with the Homebrew Channel.
# Everything here is applied in RAM only. A reboot with the boot hook removed (.\lgtv.ps1 remove) puts the TV back as LG ships it.

# --- Telemetry / suggestion services --------------------------------------------------------------
# Life's Good Without Spying already stubs admanager, adoverlay, acr2 (LivePlus), nudge, sportsalarm, uploadd, rdxd and voice,
# and blocks ~500 ad/tracking domains. These are the ones it leaves running:
#   remotelogger, service-logger : collect logs and upload them to LG
#   contentminer                 : builds the recommendation rows. Stopping it is tested against LG Home at apply time.
STOP_UNITS="remotelogger service-logger contentminer"

# --- Background preloading ------------------------------------------------------------------------
# LG keeps these apps half-started in the background "so they open faster". On a TV with 1.2 GB of RAM this costs more than it
# saves. Listed apps are switched off in LG's preload manager (in RAM; LG's own policy is back after a reboot without the hook).
#   com.webos.app.browser  : Web Browser (~28 MB, preloaded at every boot)
#   com.webos.app.voice    : voice search (its services are already stubbed, the preload is wasted)
#   com.webos.app.livemenu : the channel Guide overlay
#   com.webos.app.livetv / com.webos.app.hdmi1 : the Live TV and HDMI 1 screens (~39 MB each). Keep them if you switch to
#     HDMI 1 / antenna often and want it instant; remove them from this list to keep them preloaded.
NO_PRELOAD="com.webos.app.browser com.webos.app.voice com.webos.app.livemenu"

# Close these apps a minute after boot if they are running in the background (never the app on screen).
#   com.webos.app.browser    : closed so the preloaded copy goes away now, not at the next boot
#   org.webosbrew.safeupdate : the root "Autostart" app (~55 MB). It runs the Homebrew Channel startup.sh at boot and then just
#                              sits there. Opt-in: add it only after one test reboot shows root still comes up.
CLOSE_APPS="com.webos.app.browser"

# --- Compressed RAM (zram) ------------------------------------------------------------------------
# The kernel has zram but LG leaves it off; the only swap is on the eMMC (slow). With zram, idle pages are compressed in RAM
# (lz4) first, so apps are evicted to flash much less. Size in MB, 0 = off.
ZRAM_MB=384

# --- Flash trim -----------------------------------------------------------------------------------
# LG never runs fstrim, so the eMMC is never told which blocks are free and writes slow down over time.
# 1 = trim the writable data partitions once a week (checked at boot).
TRIM=1

# --- Home bar order -------------------------------------------------------------------------------
# Built-in apps live on the read-only system partition: they cannot be uninstalled, and LG's app manager loads the app list
# before any boot hook runs, so they cannot be hidden either. They are moved instead: APPS_FIRST to the front of the Home bar,
# APPS_LAST to the very end, out of the way (same as Edit App List > Move; LG remembers it). Store apps (IPTV Smarters, ...)
# can be uninstalled for real:  .\lgtv.ps1 uninstall-app <id>
# Ids on this TV: youtube.leanback.v4 (YouTube AdFree), com.smarterstvplayers.net (IPTV Smarters), com.webos.app.hdmi1 (HDMI 1),
#   com.webos.app.discovery (Apps = LG Content Store), com.webos.app.mediadiscovery (Media Player, USB playback),
#   com.webos.app.browser (Web Browser), com.webos.app.camera, com.webos.app.homeconnect (Home Hub),
#   com.webos.app.lifeonscreen (LG Gallery+), com.webos.app.sportsteamsettings (Sports),
#   org.webosbrew.hbchannel, org.webosbrew.safeupdate (root Autostart), ooo.lew.lifesgoodwithoutspying
APPS_FIRST="youtube.leanback.v4 com.smarterstvplayers.net com.webos.app.hdmi1"
APPS_LAST="ooo.lew.lifesgoodwithoutspying org.webosbrew.safeupdate com.webos.app.sportsteamsettings com.webos.app.homeconnect com.webos.app.lifeonscreen com.webos.app.camera"
